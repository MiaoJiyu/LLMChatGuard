server_name: "My Server"

# 模型选择（对应 models/ 下的文件名前缀，不含扩展名）
model: "default"

# 自定义提示词模板文件路径（相对于插件数据目录）
# 留空则使用内置默认提示词，也可在模型配置中覆盖
custom_prompt_template: "prompts/default_prompt.txt"

# 检测模式参数
afk_timeout_minutes: 5
sample_rate: 0.5
sampling_strategy: "probability"   # probability 或 fixed_players

# 处罚命令模板（变量：{playerName} {serverName} {bannedWords} {reason}）
punishment_command: "/ban {playerName} 您触发了{serverName}违禁词自动检测系统，被处以封禁惩罚。【此处罚由系统自动处理】"

# API 调用控制
max_concurrent_requests: 5
retry_count: 0

# 失败策略：pass（放行）或 local（本地关键词兜底检测）
failure_policy: "pass"

# 日志
log_retention_days: 7
log_archive_hour: 3    # 每日打包时间（24小时制）

# Web 面板
web_port: 8080
web_bind_address: "127.0.0.1"
web_admin:
  username: "admin"
  password: "admin123"   # 建议使用 BCrypt 哈希（以 $2a$/$2b$/$2y$ 开头），明文也可
  session_timeout_minutes: 30
